[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amplitude-lab"
dynamic = ["version"]
description = "Agent-assisted, deterministically validated one-loop scalar scattering amplitudes"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "amplitude-lab contributors" }]
keywords = ["quantum field theory", "scattering amplitudes", "one-loop", "positivity", "EFT"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "sympy>=1.12",
    "mpmath>=1.3",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0.0", "python-dotenv>=1.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.5"]

[project.scripts]
amplitude-lab = "amplitude_lab.cli:main"

[tool.setuptools.dynamic]
version = { attr = "amplitude_lab.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
amplitude_lab = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "gemini: makes a real network request; opt in with RUN_GEMINI_SMOKE=1",
    "slow: slower numerical checks",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.coverage.run]
source = ["amplitude_lab"]
