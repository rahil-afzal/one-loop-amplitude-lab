[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amplitude-lab"
dynamic = ["version"]
description = "Test bed for LLM agents deriving one-loop scattering amplitudes, with physics checks as the judge"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["sympy>=1.12", "mpmath>=1.3"]

[project.optional-dependencies]
gemini = ["google-genai>=1.0.0", "python-dotenv>=1.0"]
dev = ["pytest>=7.0", "scipy>=1.10", "ruff>=0.5"]

[project.scripts]
amplitude-lab = "amplitude_lab.cli:main"

[tool.setuptools.dynamic]
version = { attr = "amplitude_lab.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
amplitude_lab = ["py.typed", "tasks/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["gemini: makes a real network request to the Gemini API"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
