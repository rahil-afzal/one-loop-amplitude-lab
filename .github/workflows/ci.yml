name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Offline tests (no API key, no network)
        run: python -m pytest --cov --cov-report=term-missing
      - name: Retained CLI smoke
        shell: bash
        run: |
          python -m amplitude_lab --help
          python -m amplitude_lab --version
          python -m amplitude_lab task --task phi4_dim4
          python -m amplitude_lab derive --task phi4_dim4 --help
